name: eeg-foundation-model-cu118

# Keep Conda solving minimal on BigPurple. The complete, pinned runtime is
# installed by pip from requirements.txt, including torch 2.0.1 and CUDA 11.8
# runtime wheels. This makes Conda and pip/venv resolve the same package set.
channels:
  - conda-forge

dependencies:
  - python=3.9
  - pip
  - pip:
      - -r requirements.txt
