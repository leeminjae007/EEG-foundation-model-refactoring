seed: 1001
data:
  dataset: seed-v
  dataset_dir: /gpfs/data/oermannlab/users/ml10266/Data/eeg_foundation_downstream/SEED-V/processed
  num_workers: 8
model:
  checkpoint: outputs/gr9_1_epoch40.pth
  head_dropout: 0.1
  head_hidden_tokens: 4
optimization:
  epochs: 50
  batch_size_per_gpu: 64
  gradient_accumulation_steps: 1
