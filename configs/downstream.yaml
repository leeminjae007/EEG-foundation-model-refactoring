# Example downstream task. Use --dataset and --data-dir for another dataset.
seed: 42
data:
  dataset: chb
  dataset_dir: path
  num_workers: 8
model:
  checkpoint: path
  head_dropout: 0.1
  head_hidden_tokens: null
optimization:
  epochs: 20
  batch_size_per_gpu: 64
  gradient_accumulation_steps: 1
  tokenizer_learning_rate: 0.0001
  encoder_learning_rate: 0.0001
  head_learning_rate: 0.0001
  min_learning_rate: 1.0e-6
  weight_decay: 0.01
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
  class_counts: [285070, 1894]
runtime:
  output: outputs/downstream
  log_every_steps: 100
