# Full MJDE, GR2 geometry, independent rank RNG; input-conditioned patch_scalar fusion.
data:
  channel_names:
  - FP1
  - FP2
  - F3
  - F4
  - C3
  - C4
  - P3
  - P4
  - O1
  - O2
  - F7
  - F8
  - T3
  - T4
  - T5
  - T6
  - FZ
  - CZ
  - PZ
  dataset_dir: /gpfs/data/oermannlab/users/ml10266/Data/eeg_foundation_downstream/tuh_eeg
  num_patches: 30
  num_workers: 8
  pin_memory: true
  sample_rate: 200
  value_scale: 100.0
encoder:
  attention_dropout: 0.1
  dropout: 0.1
  embed_dim: 200
  mlp_ratio: 4.0
  norm_epsilon: 1.0e-05
  spatial_heads: 4
  temporal_heads: 4
  fusion_gate: patch_scalar
mae:
  attention_dropout: 0.1
  decoder_depth: 4
  decoder_dim: 100
  decoder_dropout: 0.1
  decoder_heads: 4
  decoder_mlp_ratio: 4.0
  norm_epsilon: 1.0e-05
  smooth_l1_beta: 0.1
masking:
  distance_metric: geodesic
  mask_ratio: 0.5
  max_radius_degrees: 75.0
  max_time_patches: 10
  min_radius_degrees: 35.0
  min_time_patches: 2
  policy: geometry_tubelet
  spatial_selection: geodesic_radius
optimization:
  adam_betas:
  - 0.9
  - 0.999
  adam_epsilon: 1.0e-08
  base_learning_rate: 0.0005
  batch_size_per_gpu: 128
  epochs: 40
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  min_learning_rate: 1.0e-05
  weight_decay: 0.05
patch_encoder:
  dropout: 0.1
  embed_dim: 200
  frequency_bins: 101
  frequency_feature_dim: 100
  frequency_hidden_dim: 100
  patch_samples: 200
  time_conv_channels:
  - 64
  - 128
  - 200
  time_feature_dim: 100
  time_group_norm_groups: 8
  time_kernel_sizes:
  - 15
  - 7
  - 3
  time_strides:
  - 5
  - 3
  - 2
position:
  decoder_spatial_dim: 50
  decoder_temporal_dim: 50
  encoder_spatial_dim: 100
  encoder_temporal_dim: 100
  rms_epsilon: 1.0e-06
  temporal_max_period: 10000.0
runtime:
  deterministic: false
  keep_last_checkpoints: 3
  log_every_steps: 20
  output: outputs/pretrain_gr2_patch_scalar
  pretrain_rank_rng: independent
  save_every_epochs: 10
seed: 42
